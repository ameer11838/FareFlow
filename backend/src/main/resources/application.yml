spring:
  application:
    name: fareflow

  config:
    # Load the gitignored repository .env whether the backend is launched from
    # this directory or the repository root. This is particularly important for
    # optional rails: requiring a shell-specific `source` command made a fully
    # configured XRPL integration silently look disabled in the UI.
    # The browser map key remains importable from frontend/.env as well.
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:.env[.properties]"
      - "optional:file:../frontend/.env[.properties]"
      - "optional:file:frontend/.env[.properties]"

  datasource:
    # Non-secret values get sensible local defaults so the app is easy to run.
    # DB_PASSWORD deliberately has NO default: if it is missing, startup fails
    # loudly instead of silently trying to connect with an empty password.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fareflow}
    username: ${DB_USERNAME:fareflow}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate is only allowed to check that the
      # tables it expects actually exist. Never 'update' -- that lets Hibernate
      # silently mutate the database and desync it from the migration history.
      ddl-auto: validate
    # Closes the persistence session at the end of the service call rather than
    # keeping it open through view rendering. Prevents accidental lazy loading
    # in the serialization layer.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

fareflow:
  auth:
    # true  -> JWT required, identity comes from the token
    # false -> demo mode: every request resolves to the seeded demo user
    enabled: ${FAREFLOW_AUTH_ENABLED:true}
    demo-user-email: ${FAREFLOW_DEMO_USER_EMAIL:demo@fareflow.app}

  jwt:
    # No default. When auth is enabled a missing or short secret fails startup
    # rather than signing tokens with a guessable key. Not needed in demo mode.
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION:86400}

  optimization:
    # Phase 1 defaults. Cost and time matter equally; transfers matter a little.
    # These are configuration rather than constants so they can be tuned without
    # a rebuild, and so the numbers live in one visible place.
    default-cost-priority: 0.45
    default-time-priority: 0.45
    default-transfer-priority: 0.10
    # Maximum fraction of the time weight shifted to cost at full budget pressure.
    budget-pressure-beta: 0.40

  usage-pricing:
    # FareFlow product simulation — these are not agency tariffs. Time is not an
    # input, so service delays can never increase the rider's charge.
    version: FAREFLOW_USAGE_V2
    bus: { base-cents: 85, cents-per-mile: 8, cents-per-stop: 3 }
    # Applied when the route provider explicitly labels a bus service "Express".
    express: { base-cents: 150, cents-per-mile: 12, cents-per-stop: 5 }
    rail: { base-cents: 120, cents-per-mile: 10, cents-per-stop: 5 }
    subway: { base-cents: 100, cents-per-mile: 8, cents-per-stop: 4 }
    light-rail: { base-cents: 90, cents-per-mile: 8, cents-per-stop: 3 }
    ferry: { base-cents: 175, cents-per-mile: 14, cents-per-stop: 6 }
    # A transfer discounts the new leg's boarding charge. Same-operator rides
    # receive a full boarding credit; inter-operator agreements receive half.
    transfers: { same-operator-credit-percent: 100, cross-operator-credit-percent: 50 }
    # Caps are applied after transfer and rider discounts. Values are product
    # simulation rules and can be replaced by agency-specific configuration.
    caps: { daily-cents: 1200, weekly-cents: 6000 }
    # Percent of the standard net fare paid by each verified rider category.
    rider-discounts: { student-percent: 75, senior-percent: 50, reduced-percent: 50 }

  stop-verification:
    # How close a reported position must be to count as "at the stop". Generous
    # on purpose: this grades evidence for the ledger, it never blocks a rider or
    # changes a fare, so a false "too far" costs more than a missed catch.
    radius-metres: 250
    # Fixes vaguer than this are recorded as unusable rather than as evidence
    # against the rider — a 500 m error circle proves nothing either way.
    max-accuracy-metres: 400
    # A rider gets the benefit of their own error radius, capped so a device
    # cannot claim its way to a verified stop by reporting huge uncertainty.
    accuracy-slack-metres: 150

  google-maps:
    # Place search and geocoding via the Places API (New). GOOGLE_MAPS_API_KEY is
    # preferred in deployed environments. Local development may reuse the
    # browser's public map key imported above so full U.S. street addresses work
    # out of the box whenever the map is configured.
    api-key: ${GOOGLE_MAPS_API_KEY:${VITE_GOOGLE_MAPS_API_KEY:}}

  google-routes:
    # Primary nationwide transit discovery. This must be a Google Maps Platform
    # key with Routes API enabled; it is intentionally separate from Gemini keys.
    # With no key, discovery falls through to imported GTFS and curated routes.
    # Defaults to the shared Maps key: one project usually enables both APIs.
    api-key: ${GOOGLE_MAPS_ROUTES_API_KEY:${GOOGLE_MAPS_API_KEY:${VITE_GOOGLE_MAPS_API_KEY:}}}

  xrpl:
    # RLUSD settlement on the XRP Ledger. Off unless an issuer, a treasury account,
    # and a custody key are all configured; with any missing, the rail reports
    # itself unavailable and wallet and card payments are unaffected.
    #
    # TESTNET or DEVNET only. Mainnet is not an option here: this holds riders'
    # signing keys, and custodial settlement of a real stablecoin is a regulated
    # activity that a product documented as a simulation must not perform.
    network: ${XRPL_NETWORK:TESTNET}
    # The RLUSD issuer on that network. No default ships, because a guessed issuer
    # would create a trustline to nothing and fail every payment far from the cause.
    issuer-address: ${XRPL_RLUSD_ISSUER:}
    # FareFlow's own funded account, which must trust the same issuer.
    treasury-address: ${XRPL_TREASURY_ADDRESS:}
    # The issuer's signing key. A rider with a trustline still holds no RLUSD, so
    # the issuer grants them an opening balance the first time they use the rail.
    # This is the simulation's demo top-up and another reason mainnet is refused.
    issuer-seed: ${XRPL_ISSUER_SEED:}
    rider-grant-rlusd: ${XRPL_RIDER_GRANT_RLUSD:250}
    # base64 32-byte AES key encrypting rider seed entropy at rest.
    # Generate with: openssl rand -base64 32
    custody-key: ${XRPL_CUSTODY_KEY:}

  assistant:
    # Optional. The rest of FareFlow boots normally without a model key and the
    # client presents a clear configuration notice in place of the composer.
    enabled: ${FAREFLOW_ASSISTANT_ENABLED:true}
    api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
    model: ${FAREFLOW_ASSISTANT_MODEL:gemini-3.7-flash}
    max-tokens: ${FAREFLOW_ASSISTANT_MAX_TOKENS:4096}
    max-tool-iterations: ${FAREFLOW_ASSISTANT_MAX_TOOL_ITERATIONS:6}
    max-history-turns: ${FAREFLOW_ASSISTANT_MAX_HISTORY_TURNS:12}

  gtfs:
    # Network ingestion is intentionally opt-in. A configured publisher is only
    # advertised as supported after its archive imports successfully.
    schedule-enabled: ${FAREFLOW_GTFS_SCHEDULE_ENABLED:false}
    realtime-enabled: ${FAREFLOW_GTFS_REALTIME_ENABLED:false}
    import-on-startup: ${FAREFLOW_GTFS_IMPORT_ON_STARTUP:false}
    static-initial-delay-millis: ${FAREFLOW_GTFS_STATIC_INITIAL_DELAY_MILLIS:60000}
    static-refresh-millis: ${FAREFLOW_GTFS_STATIC_REFRESH_MILLIS:86400000}
    realtime-initial-delay-millis: ${FAREFLOW_GTFS_REALTIME_INITIAL_DELAY_MILLIS:15000}
    realtime-refresh-millis: ${FAREFLOW_GTFS_REALTIME_REFRESH_MILLIS:30000}
    realtime-freshness-seconds: ${FAREFLOW_GTFS_REALTIME_FRESHNESS_SECONDS:120}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.flywaydb: INFO
